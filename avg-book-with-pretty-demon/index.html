<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- AVG BOOK WITH PRETTY DEMON -->
<title>AVG BOOK WITH PRETTY DEMON</title>

<!-- Noto Serif TC / 思源宋體 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#111;
  color:#fff;
  font-family:"Noto Serif TC","Noto Serif CJK TC","Noto Serif","PMingLiU","Microsoft JhengHei",serif;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100dvh;
}

#game{
  position:relative;
  width:min(100vw,450px,calc(100dvh * 9 / 16));
  height:min(100dvh,calc(100vw * 16 / 9),800px);
  aspect-ratio:9 / 16;
  overflow:hidden;
  background:#111;
  flex:0 0 auto;
}

#scene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#222;
  overflow:hidden;
}

#scene-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

#dialogue-box{
  position:absolute;
  top:3.5%;
  left:4%;
  width:45%;
  max-height:70%;
  overflow:auto;
  padding:14px 16px;
  background:rgb(255 255 255 / 74%);
  color:#575757;
  border:1px solid rgba(255,255,255,.65);
  border-radius:10px;
  backdrop-filter:blur(5px);
  z-index:10;
}


#speaker{
  display:none;
}

#message{
  position:relative;
  z-index:1;
  white-space:pre-wrap;
  line-height:2;
  font-size:clamp(15px,3.5vw,18px);
  font-weight:600;
  color:#575757;
}

#choices{
  position:absolute;
  left:4%;
  right:4%;
  bottom:4%;
  display:flex;
  flex-direction:column;
  gap:9px;
  z-index:20;
}

#choices.typing-lock{
  opacity:0;
  pointer-events:none;
}

.choice{
  width:100%;
  min-height:46px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:9px;
  background:var(--choice-bg,rgb(182 37 14 / 18%));
  color:#fff;
  text-align:left;
  font-family:"Noto Serif TC","Noto Serif CJK TC","Noto Serif","PMingLiU","Microsoft JhengHei",serif;
  font-size:clamp(14px,3.5vw,21px);
  font-weight:600;
  cursor:pointer;
  backdrop-filter:blur(3px);
  box-shadow:0 2px 8px rgba(0,0,0,.28);
}

.choice:active{
  transform:scale(.985);
  filter:brightness(1.18);
}

#emoji-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:30;
}

.demon-emoji{
  position:absolute;
  left:50%;
  top:50%;
  font-size:clamp(90px,25vw,190px);
  line-height:1;
  opacity:0;
  transform:translate(-50%,-50%) scale(.8);
  animation:demonEmojiPop 1.44s ease-out forwards;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.35));
}

@keyframes demonEmojiPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}
}

#flash{
  position:absolute;
  inset:0;
  z-index:25;
  pointer-events:none;
  background:#fff;
  opacity:0;
}

#flash.cg-flash{
  animation:cgFlash .36s ease-out forwards;
}

@keyframes cgFlash{
  0%{opacity:0}
  30%{opacity:.55}
  100%{opacity:0}
}

#ui-toggle{
  position:absolute;
  right:10px;
  top:10px;
  z-index:100;
  border:1px solid rgba(255,255,255,.35);
  border-radius:7px;
  background:rgba(0,0,0,.58);
  color:#fff;
  padding:6px 9px;
  font-size:12px;
  cursor:pointer;
}

body.ui-hidden #dialogue-box,
body.ui-hidden #choices,
body.ui-hidden #ending{
  opacity:0;
  pointer-events:none;
}

#ending{
  position:absolute;
  inset:0;
  z-index:40;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:4%;
  background:rgba(0,0,0,.18);
}

#ending-card{
  width:100%;
  margin-bottom:3%;
  padding:18px;
  background:var(--choice-bg,rgb(182 37 14 / 18%));
  border:1px solid rgba(255,255,255,.55);
  border-radius:10px;
  text-align:center;
  backdrop-filter:blur(3px);
  box-shadow:0 2px 8px rgba(0,0,0,.28);
}

#ending-text{
  line-height:1.75;
  font-size:clamp(17px,4vw,25px);
  margin-bottom:15px;
  text-align:center;
}

#ending-label{
  display:block;
  font-size:clamp(18px,4vw,25px);
  margin-bottom:2px;
}

#ending-grade{
  display:block;
  margin:0 0 14px;
  font-size:clamp(52px,12vw,72px);
  line-height:1;
  font-weight:900;
}

#ending-message{
  display:block;
  white-space:pre-wrap;
  line-height:1.75;
  font-size:clamp(17px,4vw,25px);
}

#ending-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

#restart,#gallery-open,#gallery-reset{
  border:1px solid rgba(255,255,255,.55);
  border-radius:8px;
  background:rgba(255,255,255,.12);
  color:#fff;
  padding:9px 18px;
  font-family:"Noto Serif TC","Noto Serif CJK TC","Noto Serif","PMingLiU","Microsoft JhengHei",serif;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

#gallery[hidden]{
  display:none !important;
}

#gallery{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  max-height:100%;
  min-height:0;
  z-index:60;
  display:none;
  flex-direction:column;
  background:rgba(10,10,10,.96);
  padding:18px 14px;
  overflow:hidden;
}

#gallery-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

#gallery-title{
  font-size:22px;
  font-weight:700;
}

#gallery-header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

#gallery-close,#gallery-reset{
  border:1px solid rgba(255,255,255,.4);
  border-radius:8px;
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:7px 12px;
  font-size:16px;
  cursor:pointer;
}

#gallery-grid{
  position:absolute;
  left:14px;
  right:14px;
  top:72px;
  bottom:7%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:12px;
  align-items:stretch;
  justify-items:stretch;
  overflow:hidden;
}

.gallery-item{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  margin:0;
  padding:0;
  position:relative;
  border:1px solid rgba(255,255,255,.28);
  border-radius:9px;
  overflow:hidden;
  background:#191919;
  color:inherit;
  cursor:pointer;
}

.gallery-item.locked{
  aspect-ratio:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.48);
  background:rgba(255,255,255,.035);
  cursor:default;
}

.gallery-item.locked span{
  font-size:14px;
  line-height:1.8;
  text-align:center;
}

.gallery-item.locked small{
  font-size:11px;
}

.gallery-item img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}


#gallery-viewer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  max-height:100%;
  z-index:200;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:58px 10px 10px;
  background:rgba(0,0,0,.96);
  overflow:hidden;
}

#gallery-viewer img{
  position:relative;
  z-index:202;
  display:block;
  flex:0 1 auto;
  max-width:100%;
  max-height:calc(100% - 72px);
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:0;
}

#gallery-viewer-close{
  position:absolute;
  top:12px;
  right:12px;
  z-index:204;
  border:1px solid rgba(255,255,255,.5);
  border-radius:50%;
  width:40px;
  height:40px;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

#gallery-download{
  position:absolute;
  left:12px;
  top:13px;
  z-index:204;
  color:#fff;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.5);
  border-radius:8px;
  background:rgba(0,0,0,.55);
  padding:7px 11px;
  font-size:14px;
}

#site-footer{
  position:absolute;
  left:0;
  right:0;
  bottom:1.1%;
  z-index:90;
  height:auto;
  padding:0 8px;
  text-align:center;
  font-family:Arial, Helvetica, sans-serif;
  font-size:8px;
  line-height:1.2;
  font-weight:400;
  color:rgba(255,255,255,.72);
  text-shadow:0 1px 3px rgba(0,0,0,.75);
  pointer-events:auto;
}

#site-footer a{
  color:rgba(255,255,255,.82);
  text-decoration:none;
}

#site-footer a:hover{
  text-decoration:underline;
}


#story-menu[hidden]{
  display:none !important;
}

#story-menu{
  pointer-events:auto;
  position:absolute;
  inset:0;
  z-index:1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:28px 22px;
  background:#111;
  text-align:center;
}
body.story-menu-open #scene{
  pointer-events:none;
}
body.story-menu-open #ui-toggle{
  pointer-events:none;
}
#story-menu-title{
  font-size:clamp(20px,5vw,28px);
  font-weight:800;
  letter-spacing:.03em;
}
#story-menu-subtitle{
  font-size:12px;
  letter-spacing:.18em;
  opacity:.58;
  margin-bottom:10px;
}
#story-menu-list{
  width:min(100%,360px);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.story-choice{
  position:relative;
  z-index:2;
  pointer-events:auto;
  width:100%;
  border:1px solid rgba(255,255,255,.28);
  border-radius:10px;
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:13px 15px;
  font-family:"Noto Serif TC","Noto Serif CJK TC","Noto Serif","PMingLiU","Microsoft JhengHei",serif;
  cursor:pointer;
  text-align:left;
}
.story-choice-title{
  display:block;
  font-size:16px;
  font-weight:700;
}
.story-choice-author{
  display:block;
  margin-top:3px;
  font-size:12px;
  opacity:.62;
}

#error{
  padding:30px 20px;
  text-align:center;
  line-height:1.7;
  color:#ffb0b0;
}

@media(min-width:721px){
  #game{
    margin:0;
    box-shadow:0 8px 40px rgba(0,0,0,.5);
  }
}

/* Story-list accordion */
.story-work {
  width: 100%;
}
.story-version {
  margin-left: 30px;
  width: calc(100% - 30px);
}
.story-version .story-choice-title {
  font-weight: 600;
}
@media (max-width: 700px) {
  .story-version {
    margin-left: 18px;
    width: calc(100% - 18px);
  }
}

.story-arrow{white-space:pre;}
</style>
</head>

<body>
<main id="game">
  <section id="story-menu" aria-label="劇本選單">
    <div id="story-menu-title">AVG BOOK WITH PRETTY DEMON</div>
    <div id="story-menu-subtitle">SELECT STORY</div>
    <div id="story-menu-list"></div>
  </section>

  <button id="ui-toggle" type="button">UI</button>
  <div id="scene">
    <img id="scene-image" src="img/ddd-avg-red-cg1_s.jpg" alt="">
    <div id="flash"></div>
    <div id="emoji-layer"></div>

    <section id="dialogue-box">
      <div id="speaker"></div>
      <div id="message"></div>
    </section>

    <section id="choices"></section>

    <section id="ending">
      <div id="ending-card">
        <div id="ending-text"></div>
        <div id="ending-actions">
          <button id="gallery-open" type="button">CG 畫廊</button>
          <button id="restart" type="button">重新開始</button>
        </div>
      </div>
    </section>
  <footer id="site-footer">
    © 2026 Derive Dimension Demon ·
    <a href="https://derivedimensiondemon.wordpress.com/" target="_blank" rel="noopener">Official Website</a>
    ｜<a href="https://derivedimensiondemon.wordpress.com/terms/" target="_blank" rel="noopener">Terms</a>
  </footer>
  </div>

  <section id="gallery" aria-label="CG 畫廊">
    <div id="gallery-header">
      <div id="gallery-title">CG 畫廊</div>
      <div id="gallery-header-actions">
        <button id="gallery-reset" type="button">重置</button>
        <button id="gallery-close" type="button">關閉</button>
      </div>
    </div>
    <div id="gallery-grid"></div>
  </section>

  <div id="gallery-viewer" aria-label="CG 預覽">
    <button id="gallery-viewer-close" type="button" aria-label="關閉">×</button>
    <a id="gallery-download" href="#" download>下載 CG</a>
    <img id="gallery-viewer-image" src="" alt="">
  </div>

  <div id="error" hidden></div>

</main>

<script>
"use strict";

const STORY_URL = "storyboard/story-red-studywithyou.json";
const COLOR_BOX_URL = "storyboard/color-box.json";
const DEFAULT_CG = "img/ddd-avg-red-cg1_s.jpg";
const DEFAULT_COLOR = "rgb(182 37 14 / 18%)";
const SAVE_KEY = "ddd-avg-book-with-pretty-demon-save-v1";

const DEFAULT_GALLERY_IMAGES = [
  "ddd-avg-red-cg1.jpg",
  "ddd-avg-red-cg2.jpg",
  "ddd-avg-red-cg3.jpg",
  "ddd-avg-red-cg4.jpg"
];

const scene = document.getElementById("scene");
const sceneImage = document.getElementById("scene-image");
const speaker = document.getElementById("speaker");
const message = document.getElementById("message");
const choicesBox = document.getElementById("choices");
const emojiLayer = document.getElementById("emoji-layer");
const flash = document.getElementById("flash");
const ending = document.getElementById("ending");
const endingText = document.getElementById("ending-text");
const storyMenu = document.getElementById("story-menu");
const storyMenuList = document.getElementById("story-menu-list");
const restartButton = document.getElementById("restart");
const galleryOpen = document.getElementById("gallery-open");
const gallery = document.getElementById("gallery");
const galleryClose = document.getElementById("gallery-close");
const galleryReset = document.getElementById("gallery-reset");
const galleryGrid = document.getElementById("gallery-grid");
const galleryViewer = document.getElementById("gallery-viewer");
const galleryViewerImage = document.getElementById("gallery-viewer-image");
const galleryViewerClose = document.getElementById("gallery-viewer-close");
const galleryDownload = document.getElementById("gallery-download");
const uiToggle = document.getElementById("ui-toggle");
const errorBox = document.getElementById("error");

let story = null;
let currentStory = null;
let colorBox = {};
let currentFlowId = 1;
let totalScore = 0;
let currentCg = DEFAULT_CG;
let currentSpeaker = "紅";
let typingTimer = null;
let typingToken = 0;

function showError(text){
  scene.hidden = true;
  errorBox.hidden = false;
  errorBox.textContent = text;
}

async function loadJson(url){
  const response = await fetch(url, {cache:"no-store"});
  if(!response.ok) throw new Error(`${url} → HTTP ${response.status}`);
  return response.json();
}

function clearError(){
  errorBox.hidden = true;
  errorBox.textContent = "";
}

async function loadColorBox(){
  try{
    colorBox = await loadJson("storyboard/color-box.json");
  }catch(error){
    // Color-box is presentation data, not a prerequisite for loading a story.
    // Keep the default choice color if the optional file is unavailable.
    console.warn("color-box.json 無法載入，改用預設選項顏色：", error);
    colorBox = {};
  }
}


function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return {unlockedCgs:[]};
    const data = JSON.parse(raw);
    return {
      unlockedCgs: Array.isArray(data.unlockedCgs) ? data.unlockedCgs : []
    };
  }catch{
    return {unlockedCgs:[]};
  }
}

function saveCgUnlock(filename){
  const save = loadSave();
  if(save.unlockedCgs.includes(filename)) return;

  save.unlockedCgs.push(filename);
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  }catch{
    // 若瀏覽器阻擋 localStorage，遊戲本身仍可正常繼續。
  }
}

function resetCgProgress(){
  const confirmed = window.confirm(
    "※解鎖新CG時，自動以瀏覽器暫存功能存檔。\n\n" +
    "若想重置CG解鎖進度為初始狀態，請點確認，此動作無法復原！（每一本劇本書的CG都會清除!並非只清除當前劇本）"
  );

  if(!confirmed) return;

  try{
    localStorage.removeItem(SAVE_KEY);
  }catch{
    // 若瀏覽器阻擋 localStorage，忽略即可。
  }

  openGallery();
}

function getGalleryImages(){
  // 畫廊只顯示「目前劇本」實際使用到的 CG。
  // 由劇本資料自動收集，不再把紅的 CG 寫死在 HTML。
  if(!story) return [...DEFAULT_GALLERY_IMAGES];

  const images = [];
  const seen = new Set();

  const addImage = (value)=>{
    if(typeof value !== "string" || !value.trim()) return;

    let filename = value.trim();
    filename = filename.replace(/^img\//, "");
    filename = filename.replace(/_s\.jpg$/i, ".jpg");

    if(!/\.jpg$/i.test(filename)) return;
    if(seen.has(filename)) return;

    seen.add(filename);
    images.push(filename);
  };

  const walk = (value)=>{
    if(Array.isArray(value)){
      value.forEach(walk);
      return;
    }

    if(!value || typeof value !== "object") return;

    if(value.type === "cg"){
      addImage(value.image);
    }

    // Flow 可直接指定進場/頁面 CG。
    if(Object.prototype.hasOwnProperty.call(value, "cg")){
      addImage(value.cg);
    }

    Object.keys(value).forEach(key=>{
      if(key !== "type" && key !== "cg"){
        walk(value[key]);
      }
    });
  };

  walk(story);

  return images.length ? images : [...DEFAULT_GALLERY_IMAGES];
}

function isCgUnlocked(filename, galleryImages){
  const save = loadSave();

  // 每一本劇本的第一張 CG 都視為初始 CG。
  const firstCg = galleryImages && galleryImages.length
    ? galleryImages[0]
    : DEFAULT_GALLERY_IMAGES[0];

  return filename === firstCg || save.unlockedCgs.includes(filename);
}

function openGallery(){
  galleryGrid.innerHTML = "";

  const galleryImages = getGalleryImages();

  galleryImages.forEach((filename,index)=>{
    const item = document.createElement("button");
    item.type = "button";
    item.className = "gallery-item";
    item.setAttribute("aria-label",`CG ${index + 1}`);

    if(isCgUnlocked(filename, galleryImages)){
      const img = document.createElement("img");
      // 畫廊格狀縮圖只載入 _s.jpg；點開預覽時才載入原尺寸 CG。
      const thumbnail = filename.replace(/\.jpg$/i, "_s.jpg");
      img.src = `img/${thumbnail}`;
      img.alt = `CG ${index + 1}`;
      img.loading = "lazy";
      img.decoding = "async";
      item.appendChild(img);
      item.addEventListener("click",()=>openGalleryViewer(filename));
    }else{
      item.disabled = true;
      item.classList.add("locked");
      item.innerHTML = `<span>CG ${index + 1}<br><small>尚未解鎖</small></span>`;
    }

    galleryGrid.appendChild(item);
  });

  gallery.style.display = "flex";
  uiToggle.style.display = "none";
}

function closeGallery(){
  gallery.style.display = "none";
  closeGalleryViewer();
  uiToggle.style.display = "";
}

function openGalleryViewer(filename){
  const path = `img/${filename}`;
  galleryViewerImage.src = path;
  galleryViewerImage.alt = filename;
  galleryDownload.href = path;
  galleryDownload.download = filename;
  galleryViewer.style.display = "flex";
  uiToggle.style.display = "none";
}

function closeGalleryViewer(){
  galleryViewer.style.display = "none";
  galleryViewerImage.src = "";
  if(gallery.style.display !== "flex"){
    uiToggle.style.display = "";
  } else {
    uiToggle.style.display = "none";
  }
}


let storyList = null;
let selectedStory = null;
let expandedStoryId = null;

function isValidStoryEntry(storyEntry){
  return !!(storyEntry && storyEntry.id && storyEntry.title);
}
function validVersionEntry(version){
  return !!(version && version.id && version.title && version.file);
}

function renderStoryMenu(stories){
  storyMenuList.innerHTML = "";

  const validStories = Array.isArray(stories)
    ? stories.filter(isValidStoryEntry)
    : [];

  if(validStories.length === 0){
    showError("story-list.json 沒有可載入的劇本。");
    return;
  }

  validStories.forEach((storyEntry)=>{
    const isOpen = expandedStoryId === storyEntry.id;

    const workButton = document.createElement("button");
    workButton.type = "button";
    workButton.className = "story-choice story-work";

    const workTitle = document.createElement("span");
    workTitle.className = "story-choice-title";

    const arrow = document.createElement("span");
    arrow.className = "story-arrow";
    arrow.textContent = isOpen ? "▼　" : "➤　";

    const workName = document.createElement("span");
    workName.textContent = storyEntry.title;

    workTitle.append(arrow, workName);
    workButton.appendChild(workTitle);

    workButton.addEventListener("click",(event)=>{
      event.preventDefault();
      event.stopPropagation();
      expandedStoryId = isOpen ? null : storyEntry.id;
      renderStoryMenu(validStories);
    });

    storyMenuList.appendChild(workButton);

    if(!isOpen) return;

    const versions = Array.isArray(storyEntry.versions)
      ? storyEntry.versions.filter(validVersionEntry)
      : [];

    versions.forEach((versionEntry)=>{
      const versionButton = document.createElement("button");
      versionButton.type = "button";
      versionButton.className = "story-choice story-version";

      const title = document.createElement("span");
      title.className = "story-choice-title";
      title.textContent = versionEntry.title;

      const description = document.createElement("span");
      description.className = "story-choice-author";
      description.textContent = versionEntry.description || "";

      versionButton.append(title, description);

      versionButton.addEventListener("click", async (event)=>{
        event.preventDefault();
        event.stopPropagation();
        await startSelectedStory(storyEntry, versionEntry);
      });

      storyMenuList.appendChild(versionButton);
    });
  });

  storyMenu.hidden = false;
}

async function loadStoryList(){
  document.body.classList.add("story-menu-open");
  scene.hidden = true;
  storyMenu.hidden = false;
  const response = await fetch("storyboard/story-list.json", {cache:"no-store"});
  if(!response.ok) throw new Error(`無法載入 story-list.json（${response.status}）`);
  storyList = await response.json();
  const stories = Array.isArray(storyList.stories)
    ? storyList.stories.filter(isValidStoryEntry)
    : [];

  if(expandedStoryId === null && stories.length > 0){
    expandedStoryId = stories[0].id;
  }

  clearError();
  renderStoryMenu(stories);
}

async function startSelectedStory(storyEntry, versionEntry){
  selectedStory = {story:storyEntry, version:versionEntry};
  clearError();

  const oldLoadError = document.getElementById("story-load-error");
  if(oldLoadError) oldLoadError.remove();

  try{
    const response = await fetch(
      `storyboard/story-${storyEntry.id}/${versionEntry.file}`,
      {cache:"no-store"}
    );
    if(!response.ok){
      throw new Error(`無法載入劇本：${versionEntry.file}（${response.status}）`);
    }

    const loadedStory = await response.json();
    if(!Array.isArray(loadedStory.flows) || !loadedStory.ending){
      throw new Error(`劇本格式不完整：${versionEntry.file}`);
    }

    story = loadedStory;
    currentStory = loadedStory;
    totalScore = 0;
    currentFlowId = 1;
    currentCg = DEFAULT_CG;
    currentSpeaker = "紅";

    // 若劇本第一個 Flow 有指定 CG，進場時就直接使用它，
    // 避免黑劇本先短暫顯示預設的紅 CG。
    const firstFlow = getFlow(1);
    if(firstFlow && firstFlow.cg){
      currentCg = firstFlow.cg.startsWith("img/")
        ? firstFlow.cg
        : `img/${firstFlow.cg}`;
    }

    ending.style.display = "none";
    storyMenu.hidden = true;
    document.body.classList.remove("ui-hidden");
    document.body.classList.remove("story-menu-open");
    sceneImage.src = currentCg;

    sessionStorage.setItem("avgBookSelectedStory", JSON.stringify({
      storyId:storyEntry.id,
      versionId:versionEntry.id,
      storyTitle:storyEntry.title,
      versionTitle:versionEntry.title,
      file:`storyboard/story-${storyEntry.id}/${versionEntry.file}`
    }));

    await loadColorBox();
    applySpeakerColor(currentSpeaker);
    scene.hidden = false;
    renderFlow();
  }catch(error){
    storyMenu.hidden = false;
    document.body.classList.add("story-menu-open");

    let loadError = document.getElementById("story-load-error");
    if(!loadError){
      loadError = document.createElement("div");
      loadError.id = "story-load-error";
      loadError.style.cssText =
        "width:min(100%,360px);margin-top:6px;padding:10px 14px;" +
        "border:1px solid rgba(255,255,255,.22);border-radius:8px;" +
        "background:rgba(182,37,14,.16);color:#ddd;font-size:12px;" +
        "line-height:1.6;text-align:left;";
      storyMenu.appendChild(loadError);
    }

    loadError.textContent = error.message || "劇本載入失敗。";
  }
}

function returnToStoryMenu(){
  ending.style.display = "none";
  document.body.classList.add("story-menu-open");
  scene.hidden = true;
  storyMenu.hidden = false;
  selectedStory = null;
  expandedStoryId = null;
  clearError();

  const stories = storyList && Array.isArray(storyList.stories)
    ? storyList.stories
    : [];

  renderStoryMenu(stories);
}

function getFlow(flowId){
  return story.flows.find(flow => Number(flow["flow-id"]) === Number(flowId));
}

function normalizeMessageText(text){
  // 劇本可以寫 \n\n，但畫面只保留一次斷行，避免對話框過度拉長。
  return String(text || "").replace(/\n\s*\n+/g, "\n");
}

function applySpeakerColor(name){
  currentSpeaker = name || "紅";
  const color = colorBox[currentSpeaker] || DEFAULT_COLOR;

  document.documentElement.style.setProperty("--choice-bg", color);
}

function startGame(){
  currentFlowId = 1;
  totalScore = 0;
  currentCg = DEFAULT_CG;
  currentSpeaker = "紅";

  ending.style.display = "none";
  document.body.classList.remove("ui-hidden");
  sceneImage.src = DEFAULT_CG;

  applySpeakerColor(currentSpeaker);
  renderFlow();
}

function renderFlow(){
  const flow = getFlow(currentFlowId);

  if(!flow){
    showError(`找不到 Flow ${currentFlowId}。`);
    return;
  }

  // Flow 本身可以指定初始 CG。
  // 這會在進入該頁時立即套用，因此不必等玩家按選項才換圖。
  if(flow.cg){
    changeCg(flow.cg);
  }

  const demonMessage = flow["demon-message"] || {};
  const flowSpeaker = demonMessage.speaker || "紅";
  const text = normalizeMessageText(demonMessage.text);

  speaker.textContent = flowSpeaker;
  applySpeakerColor(flowSpeaker);

  choicesBox.innerHTML = "";
  choicesBox.classList.add("typing-lock");

  if(typingTimer){
    clearInterval(typingTimer);
    typingTimer = null;
  }

  const token = ++typingToken;
  message.textContent = "";

  // 細微的 AVG 打字效果；換行照劇本立即保留。
  let index = 0;
  const typingSpeed = 24;

  typingTimer = setInterval(()=>{
    if(token !== typingToken){
      clearInterval(typingTimer);
      typingTimer = null;
      return;
    }

    message.textContent += text[index];
    index++;

    if(index >= text.length){
      clearInterval(typingTimer);
      typingTimer = null;
      buildChoices(flow);
    }
  }, typingSpeed);

  if(text.length === 0){
    clearInterval(typingTimer);
    typingTimer = null;
    buildChoices(flow);
  }
}

function buildChoices(flow){
  choicesBox.innerHTML = "";

  const choices = Array.isArray(flow.choices) ? flow.choices : [];

  choices.forEach((choice,index)=>{
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.textContent = `${index + 1}. ${choice["player-move"] || ""}`;
    button.addEventListener("click",()=>selectChoice(choice));
    choicesBox.appendChild(button);
  });

  choicesBox.classList.remove("typing-lock");
}

function selectChoice(choice){
  [...choicesBox.querySelectorAll("button")].forEach(btn=>{
    btn.disabled = true;
  });

  const score = Number(choice.score);

  if(Number.isFinite(score)){
    totalScore += score;
  }

  runEvents(choice.events || [], ()=>{
    const next = choice.next;

    if(next === null || next === undefined || next === ""){
      showEnding();
      return;
    }

    currentFlowId = Number(next);
    renderFlow();
  });
}

function runEvents(events,done){
  if(!Array.isArray(events) || events.length === 0){
    done();
    return;
  }

  let remaining = events.length;
  let finished = false;

  const finishOne = ()=>{
    remaining--;

    if(remaining <= 0 && !finished){
      finished = true;
      setTimeout(done,120);
    }
  };

  events.forEach(event=>{
    if(!event || !event.type){
      finishOne();
      return;
    }

    if(event.type === "cg"){
      changeCg(event.image || "ddd-avg-red-cg1_s.jpg");
      finishOne();
      return;
    }

    if(event.type === "demon-emoji"){
      showDemonEmoji(event.value || "");
      finishOne();
      return;
    }

    finishOne();
  });
}

function changeCg(path){
  const nextPath = path.startsWith("img/") ? path : `img/${path}`;

  if(nextPath === currentCg) return;

  currentCg = nextPath;

  const filename = nextPath.replace(/^img\//, "").replace(/_s\.jpg$/i, ".jpg");
  if(/\.jpg$/i.test(filename)){
    saveCgUnlock(filename);
  }

  sceneImage.src = currentCg;

  sceneImage.onerror = ()=>{
    sceneImage.onerror = null;
    sceneImage.src = DEFAULT_CG;
    currentCg = DEFAULT_CG;
  };
}

function showDemonEmoji(value){
  if(!value) return;

  const emoji = document.createElement("div");
  emoji.className = "demon-emoji";
  emoji.textContent = value;

  emojiLayer.appendChild(emoji);

  emoji.addEventListener("animationend",()=>{
    emoji.remove();
  },{once:true});
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showEnding(){
  const evaluations = Array.isArray(story.ending.evaluations)
    ? story.ending.evaluations
    : [];

  let result = null;

  for(const evaluation of evaluations){
    const min = Number(evaluation["min-score"]);
    const max = Number(evaluation["max-score"]);

    if(totalScore >= min && totalScore <= max){
      result = evaluation;
      break;
    }
  }

  if(!result){
    result = evaluations[evaluations.length - 1] || {"demon-message":""};
  }

  const endingSpeaker =
    result.speaker ||
    (result["demon-message-speaker"]) ||
    currentSpeaker ||
    "紅";

  applySpeakerColor(endingSpeaker);

  const grade = String(
    result.grade ||
    result["evaluation-grade"] ||
    ["A","B","C","D"][evaluations.indexOf(result)] ||
    "D"
  );

  // The ending card has its own demon-message, separate from Flow 9.
  // The evaluation entry's demon-message is the grade-specific reaction.
  const endingMessage = normalizeMessageText(
    story.ending["demon-message"]?.text ||
    story.ending["demon-message"] ||
    ""
  );

  const gradeMessage = normalizeMessageText(
    result["demon-message"] || ""
  );

  endingText.innerHTML =
    `<span id="ending-label">妳的評價</span>` +
    `<span id="ending-grade">${escapeHtml(grade)}</span>` +
    `<span id="ending-message">${escapeHtml(gradeMessage || endingMessage)}</span>`;

  ending.style.display = "flex";
}

restartButton.addEventListener("click", returnToStoryMenu);

galleryOpen.addEventListener("click",openGallery);
galleryClose.addEventListener("click",closeGallery);
galleryReset.addEventListener("click",resetCgProgress);
galleryViewerClose.addEventListener("click",closeGalleryViewer);

galleryViewer.addEventListener("click",(event)=>{
  if(event.target === galleryViewer){
    closeGalleryViewer();
  }
});

document.addEventListener("keydown",(event)=>{
  if(event.key === "Escape"){
    closeGalleryViewer();
    if(gallery.style.display === "flex") closeGallery();
  }
});

document.getElementById("ui-toggle").addEventListener("click",()=>{
  document.body.classList.toggle("ui-hidden");
});

loadStoryList().catch(error=>showError(error.message || "劇本清單載入失敗。"));
</script>
