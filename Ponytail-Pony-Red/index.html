<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PonyhairPonyRed — Observation Box</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#15131c;color:#eee;font-family:system-ui,"Microsoft JhengHei",sans-serif}
body{min-height:100svh;display:flex;justify-content:center}
.wrap{width:min(900px,100%);padding:14px 12px 24px}
h1{font-size:clamp(21px,6vw,30px);margin:0 0 2px}
.sub{font-size:13px;opacity:.72;margin-bottom:10px}

.stage-wrap{width:100%;overflow:hidden;border-radius:8px}
.stage{
  position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;
  border:2px solid #45415a;
  background:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),
    #30323b;
  background-size:5% 10%;
  touch-action:none;
}
.wall{position:absolute;background:#171923;border:2px solid #555a70;border-radius:2px}
.actor{
  position:absolute;width:clamp(42px,8vw,62px);height:clamp(50px,10vw,70px);
  object-fit:contain;object-position:left top;
  transform:translate(-50%,-100%);
  pointer-events:none;z-index:4;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.45));
}
#red{z-index:5}
.bubble{
  position:absolute;width:clamp(25px,5vw,38px);height:clamp(25px,5vw,38px);
  object-fit:contain;transform:translate(-50%,-145%);
  pointer-events:none;display:none;z-index:7
}
.shadow{
  position:absolute;width:clamp(22px,4vw,32px);height:9px;border-radius:50%;
  background:rgba(0,0,0,.34);transform:translate(-50%,0);z-index:2;
}
.trail{
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:rgba(255,70,100,.22);transform:translate(-50%,-50%);
  pointer-events:none;z-index:1
}
.hud{
  margin-top:10px;padding:9px;border:1px solid #45415a;background:#201e28;
  display:flex;gap:7px;flex-wrap:wrap;align-items:center;border-radius:7px
}
.badge{padding:5px 8px;border:1px solid #5b5868;border-radius:6px;font-size:12px}
#state{font-weight:700}
button{font:inherit;background:#2b2935;color:#eee;border:1px solid #666;border-radius:6px;padding:6px 10px}
.note{opacity:.68;font-size:12px;line-height:1.5;margin-top:7px}

@media (max-width:520px){
  .wrap{padding:10px 8px 18px}
  .stage{aspect-ratio:10/8}
  .wall{border-width:1px}
  .hud{gap:5px}
  .badge{font-size:11px;padding:4px 6px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>PonyhairPonyRed</h1>
  <div class="sub">Observation Box ／ 兩個小傢伙自己追著跑</div>

  <div class="stage-wrap">
    <div id="stage" class="stage">
      <div class="wall" data-x="2" data-y="1" data-w="4" data-h="2"></div>
      <div class="wall" data-x="12" data-y="6" data-w="4" data-h="2"></div>
      <div class="wall" data-x="9" data-y="2" data-w="2" data-h="6"></div>
      <div class="wall" data-x="4" data-y="7" data-w="3" data-h="1"></div>

      <div id="goldShadow" class="shadow"></div>
      <div id="redShadow" class="shadow"></div>
      <img id="golden" class="actor" alt="Golden">
      <img id="red" class="actor" alt="Red">
      <img id="bubble" class="bubble" src="assets/question.png" alt="">
    </div>
  </div>

  <div class="hud">
    <span class="badge">金：AI 自動亂跑</span>
    <span class="badge">紅：AI 自動追逐</span>
    <span class="badge">無 GAME OVER</span>
    <span id="state">觀察中</span>
    <button id="reset">重新開始</button>
  </div>
  <div class="note">不用操作。讓金和紅自己在格子裡亂跑、追逐、碰面，再繼續跑。</div>
</div>

<script>
const stage=document.querySelector('#stage');
const G=document.querySelector('#golden'), R=document.querySelector('#red');
const GS=document.querySelector('#goldShadow'), RS=document.querySelector('#redShadow');
const B=document.querySelector('#bubble'), stateEl=document.querySelector('#state');
const walls=[...document.querySelectorAll('.wall')];

const COLS=20, ROWS=10;
const CELL=5; // percentage of stage width/height in the logical grid
let golden, red, mode='run', tick=0, timer, animTimer;
let trails=[];

const sprites={
  gold:['assets/golden_s1.png','assets/golden_s2.png'],
  red:['assets/red_clean_s1.png','assets/red_clean_s2.png']
};

function px(x){return x*5+'%'}
function py(y){return y*10+'%'}

function setupWalls(){
  walls.forEach(w=>{
    w.style.left=px(+w.dataset.x);
    w.style.top=py(+w.dataset.y);
    w.style.width=(+w.dataset.w*5)+'%';
    w.style.height=(+w.dataset.h*10)+'%';
  });
}

function blocked(x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS) return true;
  return walls.some(w=>{
    const wx=+w.dataset.x, wy=+w.dataset.y, ww=+w.dataset.w, wh=+w.dataset.h;
    return x>=wx && x<wx+ww && y>=wy && y<wy+wh;
  });
}

function safeNeighbors(p){
  return [[1,0],[-1,0],[0,1],[0,-1]]
    .map(([dx,dy])=>({x:p.x+dx,y:p.y+dy}))
    .filter(q=>!blocked(q.x,q.y));
}

function distance(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}

function stepToward(me,target,randomness){
  const opts=safeNeighbors(me);
  if(!opts.length) return me;

  // Mostly chase, sometimes deliberately wander to keep it playful.
  if(Math.random()<randomness){
    return opts[Math.floor(Math.random()*opts.length)];
  }
  opts.sort((a,b)=>distance(a,target)-distance(b,target));
  const best=opts.filter(q=>distance(q,target)===distance(opts[0],target));
  return best[Math.floor(Math.random()*best.length)];
}

function randomFar(p,minD=4){
  const a=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(!blocked(x,y) && distance({x,y},p)>=minD) a.push({x,y});
  }
  return a.length?a[Math.floor(Math.random()*a.length)]:{x:1,y:8};
}

function render(){
  G.src=sprites.gold[tick&1];
  R.src=sprites.red[tick&1];

  for(const [el,p,shadow] of [[G,golden,GS],[R,red,RS]]){
    el.style.left=px(p.x+0.5);
    el.style.top=py(p.y+1);
    shadow.style.left=px(p.x+0.5);
    shadow.style.top=py(p.y+0.95);
  }

  B.style.left=px(red.x+0.5);
  B.style.top=py(red.y+0.98);
  B.style.display='block';

  stateEl.textContent = mode==='caught' ? '❤️ 碰面！' : '👀 自動觀察中';
}

function trail(p){
  const el=document.createElement('div');
  el.className='trail';
  el.style.left=px(p.x+.5);
  el.style.top=py(p.y+.5);
  stage.appendChild(el);
  trails.push(el);
  if(trails.length>10) trails.shift().remove();
}

function aiStep(){
  if(mode==='caught') return;

  // Golden wanders while subtly being attracted to Red.
  const newGold=stepToward(golden,red,0.62);
  const newRed=stepToward(red,golden,0.18);

  trail(red);
  golden=newGold;
  red=newRed;

  if(distance(golden,red)<=0){
    mode='caught';
    B.src='assets/heart.png';
    render();

    setTimeout(()=>{
      // No win/lose state: separate them and let the chase restart.
      golden=randomFar(red,6);
      red=randomFar(golden,6);
      mode='run';
      B.src='assets/question.png';
      trails.forEach(e=>e.remove()); trails=[];
      render();
    },550);
  }else{
    B.src = Math.random()<0.18 ? 'assets/exclaim.png' : 'assets/question.png';
    render();
  }
}

function reset(){
  clearInterval(timer); clearInterval(animTimer);
  trails.forEach(e=>e.remove()); trails=[];
  golden={x:3,y:8};
  red={x:16,y:2};
  mode='run'; tick=0;
  setupWalls();
  render();
  timer=setInterval(aiStep,240);
  animTimer=setInterval(()=>{tick++;render()},300);
}
document.querySelector('#reset').onclick=reset;
reset();
</script>
</body>
</html>
